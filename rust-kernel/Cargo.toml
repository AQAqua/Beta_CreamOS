[package]
name = "creamos-kernel-runner"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
bootloader = "0.11.10"
cream-kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[workspace]
members = ["kernel"]
default-members = ["."]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
